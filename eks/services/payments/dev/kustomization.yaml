apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments-dev
resources:
- ../base

images:
- name: payments-api
  newName: 241197444395.dkr.ecr.us-east-1.amazonaws.com/forge/payments-api
  newTag: f34d0944e1a9aa6b408362bce1bf43da812a6be9

patches:
- patch: |-
    apiVersion: forge.dev/v1alpha1
    kind: ForgeService
    metadata:
      name: payments
    spec:
      scaling:
        minReplicas: 1
      ingress:
        host: payments-dev.forgeappservices.com
      env:
        - name: LOG_LEVEL
          value: debug
        - name: ERROR_RATE
          value: "0.0"
      slo: null
