apiVersion: forge.dev/v1alpha1
kind: ForgeService
metadata:
  name: ledger
spec:
  env:
  - name: LOG_LEVEL
    value: info
  health:
    liveness: /health/live
    readiness: /health/ready
  image: payments-api
  observability:
    metricsPort: 9090
  owner: ledger-team
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 32Mi
  runtime:
    port: 8080
  scaling:
    maxReplicas: 5
    minReplicas: 2
  slo:
    availability: "99.9"
    latencyP99Ms: 500
