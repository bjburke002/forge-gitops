apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments-dev
resources:
- ../base

images:
- name: payments-api
  newName: 241197444395.dkr.ecr.us-east-1.amazonaws.com/forge/payments-api
  newTag: cec257e8b2b904c24a5473d4a1ec7dd1bd6bdf8c

patches:
- patch: |-
    apiVersion: forge.dev/v1alpha1
    kind: ForgeService
    metadata:
      name: payments
    spec:
      scaling:
        minReplicas: 1
      ingress:
        host: payments-dev.forgeappservices.com
      env:
        - name: LOG_LEVEL
          value: debug
        - name: ERROR_RATE
          value: "0.1"
      slo: null
