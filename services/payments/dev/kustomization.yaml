apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments-dev
resources:
- ../base

images:
- name: payments-api
  newName: 241197444395.dkr.ecr.us-east-1.amazonaws.com/forge/payments-api
  newTag: 66a642fa9b29364d32b42daa9a0cff3a8e5057f4

patches:
- patch: |-
    apiVersion: forge.dev/v1alpha1
    kind: ForgeService
    metadata:
      name: payments
    spec:
      scaling:
        minReplicas: 1
      ingress:
        host: payments-dev.forgeappservices.com
      env:
        - name: LOG_LEVEL
          value: debug
      slo: null