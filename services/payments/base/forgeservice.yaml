apiVersion: forge.dev/v1alpha1
kind: ForgeService
metadata:
  name: payments
spec:
  owner: payments-team
  image: payments-api
  runtime:
    port: 8080
  scaling:
    minReplicas: 2
    maxReplicas: 5
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  ingress:
    host: payments.forgeappservices.com
  health:
    readiness: /health/ready
    liveness: /health/live
  observability:
    metricsPort: 9090
  slo:
    availability: "99.9"
    latencyP99Ms: 500